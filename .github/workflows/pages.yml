name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          path: portfolio

      - name: Checkout TroisiUI
        uses: actions/checkout@v4
        with:
          repository: Cincinnatus101010/TroisiUI
          path: TroisiUI

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build TroisiUI
        working-directory: TroisiUI
        run: bun install && bun run build

      - name: Build portfolio
        working-directory: portfolio
        env:
          GITHUB_PAGES: "true"
        run: bun install && bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
